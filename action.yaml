name: Sigma Rules Validator
description: "Validate Sigma rules using the JSON schema"
branding:
  icon: check-circle
  color: green
inputs:
  paths:
    description: "Paths to the Sigma rules (can be a newline-separated list of paths or files)"
    required: false
    default: "./"
  schemaURL:
    description: "URL of the JSON schema"
    required: false
    default: "https://raw.githubusercontent.com/SigmaHQ/sigma-specification/refs/heads/main/json-schema/sigma-detection-rule-schema.json"
  schemaFile:
    description: "Path to the local JSON schema"
    required: false
runs:
  using: "composite"
  steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.13'
    - name: Install dependencies
      shell: bash
      run: pip install requests check-jsonschema
    - name: Validate Sigma rules
      shell: bash
      run: |
        echo "Downloading validate.py from Sigma repository"
        wget -O ${{ github.action_path }}/validate.py https://raw.githubusercontent.com/SigmaHQ/sigma/master/tests/validate-sigma-schema/validate.py

        echo "Validating Sigma rules against sigma-schema.json"
        # Do not rely on `sudo -E` to preserve the environment: a runner image
        # update changed the sudo policy and silently dropped SIGMA_RULES_PATH,
        # making validate.py fall back to scanning the whole workspace.
        # Pass the variables explicitly so they survive any env_reset policy,
        # and resolve python once outside sudo so the pinned interpreter from
        # setup-python is used instead of the system one.
        python_bin="$(command -v python)"
        check-jsonschema --schemafile "$(python "${{ github.action_path }}/validate.py" schema)" "$(sudo env SIGMA_RULES_PATH="$SIGMA_RULES_PATH" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" "$python_bin" "${{ github.action_path }}/validate.py" rules)"
      env:
        SIGMA_RULES_PATH: ${{ inputs.paths }}
        SIGMA_SCHEMA_URL: ${{ inputs.schemaURL }}
        SIGMA_SCHEMA_FILE: ${{ inputs.schemaFile }}
